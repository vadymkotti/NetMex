<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetMex - Connect</title>
    <style>
        body {
            background-color: #000000;
            background-image: 
                radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%),
                linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,1) 100%);
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: rgba(0, 0, 0, 0.75);
            padding: 60px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: left;
        }

        h1 {
            color: #E50914;
            margin: 0 0 30px 0;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 2rem;
            font-weight: 700;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            background: #454545;
            outline: 2px solid #E50914;
        }

        .btn {
            width: 100%;
            background-color: #E50914;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #b9090b;
        }

        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .status-msg {
            margin-top: 15px;
            font-size: 0.9rem;
            height: 20px;
            color: #E50914;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>NETMEX</h1>
        <h2>Connect</h2>
        
        <div class="input-group">
            <input type="text" placeholder="Server IP (e.g. 192.168.1.50)" id="serverIp">
        </div>

        <div class="input-group">
            <input type="text" placeholder="TMDB API Key" id="tmdbKey">
        </div>

        <button class="btn" id="connectBtn">CONNECT TO SERVER</button>
        <div id="status" class="status-msg"></div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        document.getElementById('serverIp').value = localStorage.getItem('netmex_server') || '';
        document.getElementById('tmdbKey').value = localStorage.getItem('netmex_api_key') || '';

        connectBtn.addEventListener('click', async () => {
            const ip = document.getElementById('serverIp').value;
            const key = document.getElementById('tmdbKey').value;

            if (!ip || !key) {
                statusDiv.innerText = 'Both fields are required.';
                return;
            }

            // Starta laddnings-effekt
            connectBtn.disabled = true;
            connectBtn.innerText = 'AUTHENTICATING...';
            statusDiv.innerText = 'Verifying API Key...';

            try {
                const response = await fetch(`https://themoviedb.org{key}`);
                
                if (response.ok) {
                    statusDiv.style.color = '#46d369'; 
                    statusDiv.innerText = 'Success! Redirecting...';

                    localStorage.setItem('netmex_server', ip);
                    localStorage.setItem('netmex_api_key', key);

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    throw new Error('Invalid API Key');
                }
            } catch (err) {
                statusDiv.style.color = '#E50914';
                statusDiv.innerText = 'Error: ' + err.message;
                connectBtn.disabled = false;
                connectBtn.innerText = 'CONNECT TO SERVER';
            }
        });
    </script>

</body>
</html>
