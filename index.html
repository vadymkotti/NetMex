<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetMex</title>
    <style>
        body {
            background-color: #000000;
            background-image: 
                radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%),
                linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,1) 100%);
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 1;
        }

        h1 {
            color: #E50914;
            margin: 0;
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: -5px;
            line-height: 0.8;
            text-transform: uppercase;
        }

        h2 {
            margin: 25px 0 10px 0;
            font-size: 3.5rem;
            font-weight: 700;
        }

        p {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 400;
            color: #cccccc;
        }

        .btn {
            margin-top: 40px;
            background-color: #E50914;
            color: white;
            border: none;
            padding: 22px 60px;
            font-size: 1.8rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: #b9090b;
        }

        .btn::after {
            content: '>';
            margin-left: 20px;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>NETMEX</h1>
        <h2>The Entire Media System.</h2>
        <p>Your media, your server, your way.</p>
        <button class="btn">CONNECT TO SERVER</button>
    </div>

</body>
</html>
